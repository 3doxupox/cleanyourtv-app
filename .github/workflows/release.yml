# Release builds. CI never signs and holds no key: the release key stays offline with the
# maintainer, who signs the same reproducible build locally (scripts/release-on-forge.sh) and
# attaches it to the GitHub Release. What CI adds is an independent build to check that APK against.
#
# On a `v*` tag (or by hand, workflow_dispatch):
#   build   two clean builds of the commit in the pinned container (docker/repro), each in a fresh
#           container with an empty Gradle home, byte compared; the unsigned APK, its sha256, the R8
#           mapping and a CycloneDX SBOM are uploaded as workflow artifacts.
#   verify  run by hand with `release_tag` once the Release exists: downloads the maintainer's
#           signed APK from that Release and checks it against this run's unsigned build with
#           scripts/verify-release.sh (apksigner: v2 and v3, one signer, the certificate in
#           docs/release-signer.sha256; apksigcopier compare: the signed APK is exactly this
#           unsigned build plus a signature; scripts/check-apk.py). Run it on the tag:
#             gh workflow run release.yml --ref v0.1.0 -f release_tag=v0.1.0
#
# Every action is pinned by commit; bump them by a reviewed change.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Verify the signed APK of this GitHub Release (for example v0.1.0) against this run's build"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      name: ${{ steps.facts.outputs.name }}
      sha256: ${{ steps.compare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Facts
        id: facts
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*versionName = "\([0-9][0-9A-Za-z.-]*\)".*/\1/p' build-logic/convention/src/main/kotlin/AndroidConventionPlugins.kt | head -1)
          if [ "$REF_TYPE" = tag ]; then
            # The tag name reaches file names: only plain versions get further, and it must match the app.
            printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.?[0-9]+)?$' \
              || { echo "::error::tag $REF_NAME is not vMAJOR.MINOR.PATCH with an optional -alpha/-beta/-rc suffix"; exit 1; }
            [ "${REF_NAME#v}" = "$version" ] || { echo "::error::tag $REF_NAME but versionName $version"; exit 1; }
            name="cleanyourtv-$version"
          else
            name="cleanyourtv-$version-$(git rev-parse --short=12 HEAD)"
          fi
          {
            echo "epoch=$(git log -1 --format=%ct)"
            echo "version=$version"
            echo "name=$name"
            echo "commit=$(git rev-parse HEAD)"
            echo "submodule=$(git -C third_party/cleanyourtv rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Reproducible-build image
        run: docker build -t cyt-build -f docker/repro/Dockerfile docker/repro

      - name: Source archive (no .git, no working files; the same input the maintainer builds from)
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          git archive --format=tar --prefix=src/ HEAD > "$RUNNER_TEMP/in/src.tar"
          git -C third_party/cleanyourtv archive --format=tar --prefix=src/third_party/cleanyourtv/ HEAD > "$RUNNER_TEMP/in/sub.tar"

      - name: Clean build A and clean build B, each in a fresh container with an empty Gradle home
        env:
          SOURCE_DATE_EPOCH: ${{ steps.facts.outputs.epoch }}
        run: |
          for n in a b; do
            mkdir -p "$RUNNER_TEMP/$n"
            docker run --rm --memory 6g -e SOURCE_DATE_EPOCH \
              -v "$RUNNER_TEMP/in:/in:ro" -v "$RUNNER_TEMP/$n:/out" -v "cyt-gradle-$n:/gradle" \
              cyt-build bash -euc 'tar -xf /in/src.tar -C / && tar -xf /in/sub.tar -C / && cd /src && scripts/repro-build.sh /out'
          done
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"

      - name: Compare the two builds, APK assertions on the unsigned build
        id: compare
        env:
          NAME: ${{ steps.facts.outputs.name }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum a/app-release-unsigned.apk b/app-release-unsigned.apk
          cmp a/app-release-unsigned.apk b/app-release-unsigned.apk || { echo "::error::the two clean builds differ"; exit 1; }
          mkdir -p out
          cp a/app-release-unsigned.apk "out/$NAME-unsigned.apk"
          (cd out && sha256sum "$NAME-unsigned.apk" > "$NAME-unsigned.apk.sha256")
          echo "sha256=$(cut -d' ' -f1 "out/$NAME-unsigned.apk.sha256")" >> "$GITHUB_OUTPUT"
          docker run --rm -v "$RUNNER_TEMP/in:/in:ro" -v "$RUNNER_TEMP/out:/out" cyt-build bash -euc \
            'tar -xf /in/src.tar -C / && cd /src && python3 scripts/check-apk.py /out/'"$NAME"'-unsigned.apk --unsigned --json /out/check-apk-unsigned.json'
          sudo chown -R "$(id -u):$(id -g)" out

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: CycloneDX SBOM of the release runtime classpath
        env:
          SOURCE_DATE_EPOCH: ${{ steps.facts.outputs.epoch }}
          NAME: ${{ steps.facts.outputs.name }}
          VERSION: ${{ steps.facts.outputs.version }}
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > "$RUNNER_TEMP/deps.txt"
          python3 scripts/sbom.py "$RUNNER_TEMP/deps.txt" --version "$VERSION" \
            --apk-sha256 "$(cut -d' ' -f1 "$RUNNER_TEMP/out/$NAME-unsigned.apk.sha256")" -o "$RUNNER_TEMP/out/$NAME.cdx.json"

      - name: Summary
        env:
          NAME: ${{ steps.facts.outputs.name }}
          COMMIT: ${{ steps.facts.outputs.commit }}
          SUBMODULE: ${{ steps.facts.outputs.submodule }}
          SHA: ${{ steps.compare.outputs.sha256 }}
        run: |
          {
            echo "### $NAME (unsigned, reproducible)"
            echo
            echo "- Commit: \`$COMMIT\`, upstream launcher submodule \`$SUBMODULE\`"
            echo "- Two clean container builds byte identical, SHA-256 \`$SHA\`"
            echo "- Release signer (docs/release-signer.sha256): \`$(cat docs/release-signer.sha256)\`"
            echo
            echo "Check a signed APK against this build: \`scripts/verify-release.sh signed.apk $NAME-unsigned.apk\`"
            echo "in the docker/repro image, or run this workflow on the tag with \`release_tag\` set."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.facts.outputs.name }}-unsigned
          path: |
            ${{ runner.temp }}/out/
            ${{ runner.temp }}/a/mapping/
          retention-days: 90

  verify:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.name }}-unsigned
          path: ${{ runner.temp }}/ci

      - name: The maintainer's signed APK from the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.?[0-9]+)?$' || { echo "::error::release_tag $TAG is not a version tag"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'cleanyourtv-*.apk' --dir "$RUNNER_TEMP/rel"
          ls -l "$RUNNER_TEMP/rel"

      - name: Signature, signer and apksigcopier compare against this run's unsigned build
        env:
          NAME: ${{ needs.build.outputs.name }}
        run: |
          docker build -t cyt-build -f docker/repro/Dockerfile docker/repro
          signed=$(ls "$RUNNER_TEMP"/rel/cleanyourtv-*.apk | grep -v unsigned | head -1)
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/w" cyt-build bash -euc \
            "cp -r /repo /src2 && cd /src2 && scripts/verify-release.sh /w/rel/$(basename "$signed") /w/ci/out/$NAME-unsigned.apk '' /w/verify"
          {
            echo "### Release verified"
            echo
            echo "- \`$(basename "$signed")\`: SHA-256 \`$(sha256sum "$signed" | cut -d' ' -f1)\`"
            echo "- Signed by \`$(cat docs/release-signer.sha256)\`, v2 and v3"
            echo "- apksigcopier compare: the signed APK is this run's unsigned build plus a signature"
          } >> "$GITHUB_STEP_SUMMARY"

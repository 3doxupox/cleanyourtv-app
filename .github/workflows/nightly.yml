# Nightly (ARCHITECTURE 6.8, PRODUCT-SPEC 7.1): the TV emulator matrix with the e2e harness, the
# phone instrumented suites, the Macrobenchmark trend, Baseline Profile regeneration opened as a
# pull request, and the dependency update report. Linux runners with KVM only.
name: nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  tv-e2e:
    name: TV e2e (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Emulator and the Android TV image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "platform-tools" \
            "system-images;android-${{ matrix.api }};android-tv;x86" > /dev/null

      - name: Harness classes and fixture APKs (before the emulator takes memory)
        run: |
          ./gradlew :e2e:emulatorTestClasses --console=plain
          scripts/build-e2e-fixtures.sh -o "$RUNNER_TEMP/fixtures.env"
          cat "$RUNNER_TEMP/fixtures.env" >> "$GITHUB_ENV"

      - name: Scenarios on the API ${{ matrix.api }} TV emulator
        env:
          EMU_MEMORY_MB: ${{ matrix.api == 28 && '1024' || '2048' }}
          CYT_E2E_OUT: ${{ github.workspace }}/build/e2e
          CYT_E2E_REQUIRE_ALL: ${{ vars.CYT_E2E_REQUIRE_ALL }}   # "1" once every stream is wired
        run: EMU_SDK="$ANDROID_HOME" scripts/emulator-session.sh ${{ matrix.api }} ./gradlew :e2e:emulatorTest --console=plain

      - name: Pending scenarios (skipped until their streams merge)
        if: always()
        run: |
          grep -ho 'PENDING: [^"<]*' e2e/build/test-results/emulatorTest/*.xml 2>/dev/null | sort | uniq -c \
            | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          cat build/e2e/timings-api${{ matrix.api }}.jsonl >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tv-e2e-api${{ matrix.api }}
          path: |
            build/e2e/
            e2e/build/test-results/emulatorTest/
            e2e/build/reports/tests/emulatorTest/
          retention-days: 14

  phone-instrumented:
    name: Phone instrumented (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Connected tests (the core suites on ART, signer, NSD, service, process death)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --continue --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phone-instrumented-api${{ matrix.api }}
          path: "**/build/reports/androidTests/"
          retention-days: 14

  macrobenchmark:
    name: Startup trend and Baseline Profile
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      changed: ${{ steps.profile.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Startup benchmark, then Baseline Profile generation (emulator numbers are trend only)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :benchmark:connectedBenchmarkAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR -Pandroid.testInstrumentationRunnerArguments.class=tv.cleanyour.benchmark.StartupBenchmark || echo "startup benchmark failed (trend only)"
            ./gradlew :benchmark:connectedBenchmarkAndroidTest --console=plain -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile -Pandroid.testInstrumentationRunnerArguments.class=tv.cleanyour.benchmark.BaselineProfileGenerator
      - name: Copy the generated profile into the app
        id: profile
        run: |
          f=$(find benchmark/build/outputs -name '*BaselineProfileGenerator*-baseline-prof.txt' | grep -v startup-prof | head -1)
          if [ -z "$f" ]; then echo "no profile generated"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          cp "$f" app/src/main/baseline-prof.txt
          if git diff --quiet -- app/src/main/baseline-prof.txt && git ls-files --error-unmatch app/src/main/baseline-prof.txt >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.profile.outputs.changed == 'true'
        with:
          name: baseline-profile
          path: app/src/main/baseline-prof.txt
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: macrobenchmark
          path: |
            benchmark/build/outputs/connected_android_test_additional_output/
            benchmark/build/outputs/androidTest-results/
          retention-days: 30

  # The only job with write access: it runs no build, no emulator and no Gradle, just opens the
  # pull request with the profile the read-only job produced (R5, least privilege).
  baseline-profile-pr:
    needs: macrobenchmark
    if: needs.macrobenchmark.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baseline-profile
          path: app/src/main/
      - name: Open the Baseline Profile pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          branch: nightly/baseline-profile
          title: Regenerate the Baseline Profile
          commit-message: Regenerate the Baseline Profile from the nightly macrobenchmark run
          body: Generated by nightly.yml on an API 34 emulator. Release builds use only the committed file, so they stay reproducible.
          add-paths: app/src/main/baseline-prof.txt

  dependency-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 scripts/dependency-report.py >> "$GITHUB_STEP_SUMMARY"

# F-Droid check: will F-Droid build this version, and will its build match our signed APK?
#
# F-Droid builds the app from source with the recipe in docs/fdroid/tv.cleanyour.app.yml and only
# publishes our signed APK (Binaries, AllowedAPKSigningKeys) when its own unsigned build is that APK
# minus the signature. This job runs the same recipe with fdroidserver's `fdroid build` in F-Droid's
# buildserver image (scripts/fdroid-check.sh), so a problem shows up here before it shows up there.
#
#   on a `v*` tag   build the tag; when the GitHub Release already carries cleanyourtv-X.Y.Z.apk,
#                   apksigcopier compare it with the F-Droid build (pass or fail), else report the
#                   unsigned SHA-256. Once the Release is published, run it by hand on the tag:
#                     gh workflow run fdroid.yml --ref vX.Y.Z
#   nightly         the same on the default branch (a compare only when its commit is a released tag)
#
# No secrets: the signed APK is downloaded from the public Release; nothing is signed or uploaded
# except the workflow artifact. The image is pinned by digest, fdroidserver and every action by commit.
name: fdroid

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdroid-${{ github.ref }}
  cancel-in-progress: false

env:
  FDROID_IMAGE: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
  FDROIDSERVER_COMMIT: 2d1e622fbbce7eec379453983435e5b14bea22b5

jobs:
  fdroid-check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # fdroid build clones this checkout and needs the commit and its tags
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Facts and the signed APK of this commit's release, if there is one
        id: facts
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"
          commit=$(git rev-parse HEAD)
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1 || true)
          signed=no
          if [ -n "$tag" ]; then
            url="https://github.com/$REPO/releases/download/$tag/cleanyourtv-${tag#v}.apk"
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/in/signed.apk" "$url"; then
              signed=yes
              echo "signed APK: $url ($(sha256sum "$RUNNER_TEMP/in/signed.apk" | cut -d' ' -f1))"
            else
              rm -f "$RUNNER_TEMP/in/signed.apk"
              echo "no signed APK at $url yet"
            fi
          fi
          { echo "commit=$commit"; echo "tag=$tag"; echo "signed=$signed"; } >> "$GITHUB_OUTPUT"

      - name: F-Droid build of the recipe in the buildserver image, then apksigcopier compare
        env:
          SIGNED: ${{ steps.facts.outputs.signed }}
        run: |
          mount=()
          [ "$SIGNED" = yes ] && mount=(-v "$RUNNER_TEMP/in/signed.apk:/in/signed.apk:ro")
          docker run --rm -e FDROIDSERVER_COMMIT \
            -v "$GITHUB_WORKSPACE:/seed:ro" -v "$RUNNER_TEMP/out:/out" ${mount[@]+"${mount[@]}"} \
            "$FDROID_IMAGE" bash -c 'status=0; bash /seed/scripts/fdroid-check.sh || status=$?; chown -R '"$(id -u):$(id -g)"' /out; exit $status'

      - name: Summary
        if: always()
        env:
          COMMIT: ${{ steps.facts.outputs.commit }}
          TAG: ${{ steps.facts.outputs.tag }}
        run: |
          {
            echo "### F-Droid check: ${TAG:-$COMMIT}"
            echo
            echo "- Commit \`$COMMIT\`, recipe \`docs/fdroid/tv.cleanyour.app.yml\`, fdroidserver \`$FDROIDSERVER_COMMIT\`"
            for f in "$RUNNER_TEMP"/out/*.sha256; do [ -f "$f" ] && echo "- F-Droid build: \`$(cat "$f")\`"; done
            [ -f "$RUNNER_TEMP/out/compare.txt" ] && echo "- $(cat "$RUNNER_TEMP/out/compare.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fdroid-check-${{ steps.facts.outputs.commit }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
